openapi: 3.1.0
info:
  title: DNHacks_app API
  version: 0.1.0
  description: |
    HTTP surface of `services/api`. PLACEHOLDER SPINE — replace paths with the real
    ones once the idea is locked, but keep this file as the single source of truth
    for what the web UI is allowed to call.

servers:
  - url: http://localhost:8000
    description: local dev

paths:
  /health:
    get:
      summary: Liveness. The demo laptop will need this at 3am.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  version: { type: string }

  /telemetry:
    post:
      summary: Device pushes a reading.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/telemetry.schema.json"
      responses:
        "202": { description: Accepted }
        "400": { description: Schema violation }

  /detections:
    get:
      summary: Operator UI polls (or replace with the /stream websocket below).
      parameters:
        - in: query
          name: since
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer, default: 100, maximum: 1000 }
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./schemas/detection.schema.json"

  /stream:
    get:
      summary: |
        Server-sent events of `Detection`. Prefer this over polling for the demo —
        a live-updating screen reads as far more impressive than a refresh button.
      responses:
        "200":
          description: text/event-stream of Detection objects
          content:
            text/event-stream:
              schema: { type: string }

  /depot/nodes:
    get:
      summary: |
        Every physical storage location, as graph nodes. The web UI renders these
        alongside the sourcing nodes — same graph, but these ones have a status
        that came from a sensor instead of from a sourcing model.
      responses:
        "200":
          description: All known depot bins, ordered worst-status first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./schemas/depot.schema.json"

  /depot/nodes/{node_id}:
    get:
      summary: One bin. Use for the detail panel when a judge clicks the node.
      parameters:
        - in: path
          name: node_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./schemas/depot.schema.json"
        "404": { description: No such bin }

  /depot/stream:
    get:
      summary: |
        Server-sent events of `DepotNode`, one event per state change. This is what
        makes the excursion land live on stage — the node turns amber while the
        judge is still holding their thumb on the sensor.
      responses:
        "200":
          description: text/event-stream of DepotNode objects
          content:
            text/event-stream:
              schema: { type: string }

  /depot/nodes/{node_id}/reset:
    post:
      summary: |
        Clear latched state (MKT breach, excursion timer, history) for one bin.
        Demo affordance — you will need it between judges. Not a production
        disposition: real condemned stock stays condemned until a human signs it off.
      parameters:
        - in: path
          name: node_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Reset }
        "404": { description: No such bin }
