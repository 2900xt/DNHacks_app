openapi: 3.1.0
info:
  title: DNHacks_app API
  version: 0.1.0
  description: |
    HTTP surface of `services/api`. These are the real paths — verified against the
    running service, and this file is the single source of truth for what the web UI
    is allowed to call. `/detections` and `/stream` were removed Sun 00:15: they were
    template scaffolding for a detect-and-display pipeline this project never built,
    and no producer or consumer ever existed for either.

servers:
  - url: http://localhost:8000
    description: local dev

paths:
  /health:
    get:
      summary: Liveness. The demo laptop will need this at 3am.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  version: { type: string }

  /telemetry:
    post:
      summary: Device pushes a reading.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/telemetry.schema.json"
      responses:
        "202": { description: Accepted }
        "400": { description: Schema violation }

  /depot/nodes:
    get:
      summary: |
        Every physical storage location, as graph nodes. The web UI renders these
        alongside the sourcing nodes — same graph, but these ones have a status
        that came from a sensor instead of from a sourcing model.
      parameters:
        - in: query
          name: country
          required: false
          schema: { type: string }
          description: |
            ISO-2. Only the bins homed to this country's depot — depots are local
            to a point of interest, not global, so the UI asks per country.
            Omit for every bin.
      responses:
        "200":
          description: Matching depot bins, ordered worst-status first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "./schemas/depot.schema.json"

  /depot/nodes/{node_id}:
    get:
      summary: One bin. Use for the detail panel when a judge clicks the node.
      parameters:
        - in: path
          name: node_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./schemas/depot.schema.json"
        "404": { description: No such bin }

  /depot/stream:
    get:
      summary: |
        Server-sent events of `DepotNode`, one event per state change. This is what
        makes the excursion land live on stage — the node turns amber while the
        judge is still holding their thumb on the sensor.
      responses:
        "200":
          description: text/event-stream of DepotNode objects
          content:
            text/event-stream:
              schema: { type: string }

  /depot/nodes/{node_id}/history:
    get:
      summary: |
        Temperature history for one bin, for the UI chart. The stream carries only
        state CHANGES, so a chart that plots what it has seen since connecting draws
        nothing after a page refresh - and someone will refresh mid-demo.
      parameters:
        - in: path
          name: node_id
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 2000 }
          description: Target point count. Exceeding it strides the series rather than truncating it, so the hot hour never falls off the front.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  node_id: { type: string }
                  stride: { type: integer }
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        ts: { type: number, description: Unix seconds }
                        temp_c: { type: number }
        "404": { description: No such bin }

  /depot/nodes/{node_id}/reset:
    post:
      summary: |
        Clear latched state (MKT breach, excursion timer, history) for one bin.
        Demo affordance — you will need it between judges. Not a production
        disposition: real condemned stock stays condemned until a human signs it off.
      parameters:
        - in: path
          name: node_id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Reset }
        "404": { description: No such bin }
