; CHOKEPOINT depot-node — SNS / Strategic API Reserve storage bin monitor.
;
;   pio run -t upload && pio device monitor
;
; Target board: M5Stack Core2 (ESP32-based, 320x240 ILI9341 LCD, three touch
; buttons). `pio run -e m5stack` builds the same source for a Core Basic.
; The LCD is not decoration — it is the instrument face that makes the node read
; as an instrument on a table rather than a dev board with wires. See
; src/display.cpp.
;
; Sensors:
;   BME680  I2C 0x77        — AUTHORITATIVE. temp / RH / pressure / gas.
;   DHT11   GPIO27          — cross-check only. +/-2 C cannot certify a 5 C band.
;   MQ-2    GPIO35 (ADC1)   — analog, via divider. Trend only, never absolute ppm.
;
; IDE: `pio project init --ide vscode` regenerates .vscode/ with the right include
; paths. Do that after changing lib_deps or the compiler will not find new headers.

[platformio]
default_envs = core2
description = Storage-condition monitor for a Strategic API Reserve bin

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    -Wall
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    adafruit/Adafruit BME680 Library@^2.0.4
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.16.1

; --- the board we actually build for -----------------------------------------
; Core2, NOT Core Basic. This distinction is load-bearing and cost us an evening:
;
;   Grove Port A   Core Basic 21/22   |   Core2 32/33   |   StickC Plus 32/33
;   Internal I2C   21/22 IP5306 0x75  |   21/22 AXP192 0x34
;
; On a Core2 the old 21/22 map pointed at the internal bus, so the BME680 on
; Port A was never on the wire at all. Port A pins now come from M5Unified at
; runtime (see include/pins.h) instead of being hardcoded per board.
;
; M5Unified, not M5Stack: the M5Stack library is Core Basic/Gray/Fire only. It
; compiles for a Core2 and then fails at runtime against an AXP192 that is not
; the IP5306 it is talking to. M5Unified detects the board it booted on.
[env:core2]
board = m5stack-core2
build_flags =
    ${env.build_flags}
    -DUSE_M5STACK
lib_deps =
    ${env.lib_deps}
    m5stack/M5Unified@^0.2.7

; Same source, Core Basic/Gray/Fire. Kept because the node should not care which
; Core it was flashed onto — that assumption is what broke, so it is now tested.
[env:m5stack]
board = m5stack-core-esp32
build_flags =
    ${env.build_flags}
    -DUSE_M5STACK
lib_deps =
    ${env.lib_deps}
    m5stack/M5Unified@^0.2.7

; --- headless fallback --------------------------------------------------------
; Kept only as insurance: if the Core dies at 2am, this flashes the SAME source
; to any bare ESP32 DevKit and the node keeps measuring, POSTing and printing
; NDJSON — it just has no face. display.cpp compiles to empty functions here, so
; nothing in main.cpp is conditional. Status is the onboard LED on GPIO2.
; Not the demo target. Build it with `pio run -e esp32dev`.
[env:esp32dev]
board = esp32dev
